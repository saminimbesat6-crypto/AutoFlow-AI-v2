services:
  autoflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoflow-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3456
      - DATABASE_PATH=/app/data/autoflow.sqlite
      - DB_PATH=/app/data/autoflow.sqlite
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-${ENCRYPTION_SECRET:-}}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://localhost:3456}
